# Values for staging environment

n8n:
  protocol: "https"
  host: "api.n8n.systems.staging.tr8.tech"
  webhookUrl: "https://api.n8n.systems.staging.tr8.tech/"
  editorBaseUrl: "https://api.n8n.systems.staging.tr8.tech/"
  timezone: "Asia/Singapore"

ingress:
  enabled: true
  className: "shared-alb"
  host: "api.n8n.systems.staging.tr8.tech"
  path: "/"
  pathType: Prefix
  annotations: {}

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  size: 20Gi

postgresql:
  enabled: true
  auth:
    username: n8n
    database: n8n
  primary:
    persistence:
      enabled: true
      size: 30Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  auth:
    enabled: true
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

podLabels:
  tr8.io/landscape: staging

additionalLabels:
  tr8.io/landscape: staging

podAnnotations:
  tr8.io/landscape: staging

additionalAnnotations:
  tr8.io/landscape: staging

# Node selector for staging environment
nodeSelector:
  karpenter.sh/capacity-type: "spot"
  kubernetes.io/arch: "amd64"

# Tolerations for spot instances
tolerations:
  - key: "karpenter.sh/capacity-type"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

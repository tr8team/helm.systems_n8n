# Values for staging environment

serviceAccount:
  create: false
  name: "n8n-gotrade-n8n"

n8n:
  protocol: "https"
  host: "api.n8n.systems.staging.tr8.tech"
  webhookUrl: "https://api.n8n.systems.staging.tr8.tech/"
  editorBaseUrl: "https://api.n8n.systems.staging.tr8.tech/"
  timezone: "Asia/Singapore"

ingress:
  enabled: true
  className: "nginx"
  host: "api.n8n.systems.staging.tr8.tech"
  path: "/"
  pathType: Prefix
  annotations: {}

# ALB Ingress to route traffic from ALB to nginx-ingress-controller
albIngress:
  enabled: true
  nginxServiceName: "nginx-ingress-ingress-nginx-controller"

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  size: 20Gi

postgresql:
  enabled: true
  auth:
    username: n8n
    database: n8n
  primary:
    persistence:
      enabled: true
      size: 30Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    service:
      # Use PreferDualStack to get both IPv4 and IPv6 addresses
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv4
        - IPv6

# Redis disabled because n8n's ioredis doesn't support IPv6-only clusters
# n8n will run in regular mode instead of queue mode
redis:
  enabled: false

podLabels:
  tr8.io/landscape: staging

additionalLabels:
  tr8.io/landscape: staging

podAnnotations:
  tr8.io/landscape: staging

additionalAnnotations:
  tr8.io/landscape: staging

# Node selector for staging environment
nodeSelector:
  karpenter.sh/capacity-type: "spot"
  kubernetes.io/arch: "amd64"

# Tolerations for spot instances
tolerations:
  - key: "karpenter.sh/capacity-type"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

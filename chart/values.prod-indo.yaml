# Values for production Indonesia environment

n8n:
  protocol: "https"
  host: "api.n8n.systems.prod-indo.tr8.tech"
  webhookUrl: "https://api.n8n.systems.prod-indo.tr8.tech/"
  editorBaseUrl: "https://api.n8n.systems.prod-indo.tr8.tech/"
  timezone: "Asia/Jakarta"

ingress:
  enabled: true
  className: "shared-alb"
  host: "api.n8n.systems.prod-indo.tr8.tech"
  path: "/"
  pathType: Prefix
  annotations: {}

# Production-grade resources for main pod
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Worker configuration for queue processing
worker:
  replicaCount: 2
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  sharedStorage: false

persistence:
  enabled: true
  size: 50Gi

# Production PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: n8n
    database: n8n
  primary:
    persistence:
      enabled: true
      size: 100Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    # Production-grade PostgreSQL settings
    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 512MB
      effective_cache_size = 1536MB
      maintenance_work_mem = 128MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 2621kB
      min_wal_size = 1GB
      max_wal_size = 4GB

# Production Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
  master:
    persistence:
      enabled: true
      size: 16Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 16Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

podLabels:
  tr8.io/landscape: prod-indo

additionalLabels:
  tr8.io/landscape: prod-indo

podAnnotations:
  tr8.io/landscape: prod-indo

additionalAnnotations:
  tr8.io/landscape: prod-indo

# Node selector for production environment in Indonesia region
nodeSelector:
  karpenter.sh/capacity-type: "on-demand"
  kubernetes.io/arch: "amd64"
  topology.kubernetes.io/region: "ap-southeast-3"

# High availability with pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - n8n
          topologyKey: kubernetes.io/hostname

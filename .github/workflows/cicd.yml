name: "CI/CD"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main

jobs:
  Pre-commit:
    runs-on:
      - nscloud-ubuntu-22.04-arm64-2x4-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-n8n-helm-nix-store-cache
    steps:
      - uses: AtomiCloud/actions.setup-nix@v2

      - name: Run Pre-commit checks
        run: nix develop .#ci -c scripts/ci/pre-commit.sh
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

  Release:
    needs:
      - Pre-commit
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on:
      - nscloud-ubuntu-22.04-arm64-2x4-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-n8n-helm-nix-store-cache
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # setup-nix ignores `token`/`fetch-depth` inputs, so its internal checkout leaves
      # the default GITHUB_TOKEN as the push credential — which the org ruleset's
      # "changes must be made through a pull request" rule rejects on main. Check out
      # explicitly with the release PAT (org-admin, ruleset bypass actor) instead.
      - name: Checkout with release token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
          fetch-depth: 0

      - name: Configure git identity for semantic-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: AtomiCloud/actions.setup-nix@v2
        with:
          checkout: "false"

      - name: Remove GitHooks
        run: rm ./.git/hooks/* || true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix develop .#cd -c scripts/ci/release.sh
